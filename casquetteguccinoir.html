<!DOCTYPE html>
<html lang="fr">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Crystal Luxury Glasses</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
</head>

<body data-product="casquette gucci noir" data-price="2999DA">

      <div class="bg-light"></div>
      <div class="container">
      <div class="gallery">
      <div class="image-wrapper">
           <img id="mainImage" src="lunetteguccinoir1.jpeg" class="product-image">
           <video id="mainVideo" class="product-image" controls style="display:none;">
           <source src="lunettesguccivid.mp4" type="video/mp4"></video>
      <div class="crystal-reflection"></div>
      </div>
      <div class="thumbnails">
            <img src="lunetteguccinoir2.jpeg"
                 class="thumb active"
                 onclick="changeMedia(this)">
            <img src="lunetteguccinoir3.jpeg"
                 class="thumb"
                 onclick="changeMedia(this)">
            <img src="lunetteguccinoir1.jpeg"
                 class="thumb"
                 onclick="changeMedia(this)">
  <!-- فيديو thumbnail -->
            <video class="thumb"
                   muted
                  onclick="changeMedia(this)">
            <source src="lunettesguccivid.mp4" type="video/mp4">
            </video>

      </div>
      </div>
      <div class="product-info">
            <span class="luxury-badge">PROMO 40%</span>
            <h1>lunette gucci noir</h1>
            <p class="description">💎CASQUETTE GUCCI noir ornées de Diamond Crystal noir , pour une touche de luxe et d’éclat unique✨</p>
      <div class="price-row">
            <p class="price1">4000DA</p>
            <p class="price">2999DA 299alf</p>
      <div class="stock-box">high quality ( Livraison disponible التوصيل متوفر)</div>
      </div>
            <button type="button" id="addToCart">Ajouter au panier</button>
      <div id="cart"></div>
            <label>Choisir la couleur :</label>
            <select id="color">
            <option value="اسود">أسود </option>
            </select>
      <div class="status" id="status">Disponible ✅
      </div>
      </div>
            <form id="orderForm">
            <h2>Confirmer votre commande تاكيد الطلبية</h2>
            <input type="text" id="firstName" placeholder="Nom اسم" required>
            <input type="text" id="lastName" placeholder="Prénom لقب" required>
            <input type="text" id="phone" placeholder="Téléphone رقم الهاتف" required>
            <input type="text" id="wilaya" placeholder="Wilaya الولاية" required>
            <textarea id="address" placeholder="Adresse عنوان المنزل" required></textarea>
            <button type="submit">Confirmer la commande تاكيدالطلبية</button>
            </form>
      </div>
            <script src="app.js"></script>

</body>
</html>
